services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/saturno:cached
    command: sleep infinity
    environment:
      DB_CONNECTION: sqlsrv
      DB_HOST: db
      DB_PORT: 1433
      DB_DATABASE: saturno
      DB_USERNAME: sa
      DB_PASSWORD: YourStrong!Passw0rd
      DB_ENCRYPT: true
      DB_TRUST_SERVER_CERTIFICATE: true
    depends_on:
      db-init:
        condition: service_completed_successfully

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong!Passw0rd
    ports:
      - "1433:1433"

  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      - db
    environment:
      SA_PASSWORD: YourStrong!Passw0rd
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Aguardando SQL Server (db:1433)..."
        for i in {1..50}; do
          if /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
            echo "Conectado! Criando banco saturno..."
            /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$SA_PASSWORD" -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'saturno') CREATE DATABASE [saturno]"
            echo "Pronto."
            exit 0
          fi
          echo "Tentativa $i: SQL Server ainda indisponível..."
          sleep 5
        done
        echo "Erro: Tempo esgotado."
        exit 1
