# fly.toml app configuration file generated for saturno on 2026-02-05T22:25:40-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'saturno'
primary_region = 'gru'
console_command = 'php /var/www/html/artisan tinker'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    NODE_VERSION = '24'
    PHP_VERSION = '8.4'

[deploy]
  release_command = 'php artisan migrate --force'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_URL = 'https://saturno.fly.dev'
  ASSET_URL = 'https://saturno.fly.dev'
  CACHE_DRIVER = 'file'
  DB_CONNECTION = 'pgsql'
  DB_SSLMODE = 'require'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  QUEUE_CONNECTION = 'sync'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
