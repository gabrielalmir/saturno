services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.sqlserver
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        NODE_VERSION: ${NODE_VERSION:-24}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    environment:
      DB_CONNECTION: sqlsrv
      DB_HOST: db
      DB_PORT: 1433
    depends_on:
      db-init:
        condition: service_completed_successfully

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: ${MSSQL_PID:-Developer}
      SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      - db
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Aguardando SQL Server (db:1433)..."
        for i in {1..50}; do
          if /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
            /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$SA_PASSWORD" -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'saturno') CREATE DATABASE [saturno]"
            exit 0
          fi
          sleep 5
        done
        exit 1

volumes:
  mssql_data:
